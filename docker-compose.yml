services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bantay_presyo
      POSTGRES_USER: bantay
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantay -d bantay_presyo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  vendor:
